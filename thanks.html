<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent — Tobiloba Babajide</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A1A1A'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-weight='600' font-size='30' fill='%23E97627'%3ETB%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #FAF8F4; --ink: #1A1A1A; --ink-soft: #4A4A46; --line: #E3DFD6;
    --accent: #E97627; --accent-dark: #C75E14;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink);
    min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center;
  }
  .check {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 1.6rem;
    background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 2rem;
  }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 2.4rem; letter-spacing: -0.02em; }
  p { margin-top: 1rem; color: var(--ink-soft); max-width: 46ch; }
  a.btn {
    display: inline-block; margin-top: 2rem; text-decoration: none;
    background: var(--ink); color: #fff; font-weight: 600; font-size: 0.92rem;
    padding: 0.78rem 1.6rem; border-radius: 100px; transition: background .2s;
  }
  a.btn:hover { background: var(--accent-dark); }
</style>
</head>
<body>
<main>
  <div class="check">✓</div>
  <h1>Message sent.</h1>
  <p>Thanks for reaching out — I read every message and typically reply within a day or two.</p>
  <a class="btn" href="/">← Back to portfolio</a>
</main>
</body>
</html>
